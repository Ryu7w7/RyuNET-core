name: Build Asphyxia Core
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: bash build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: core-artifact-linux
          path: build/asphyxia-core*
  # build-win and build-arm are temporarily disabled. See git history to re-enable.
  release:
    name: Create Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: core-artifact-linux
          path: ./artifacts
      - name: Display structure of downloaded files
        run: ls -R ./artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/**/asphyxia-core*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}